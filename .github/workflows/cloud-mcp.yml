name: Cloud MCP
on:
  pull_request:
    paths: ['cloud/**', '.github/workflows/cloud-mcp.yml']
  push:
    branches: ['feat/cloud-mcp']
    paths: ['cloud/**', '.github/workflows/cloud-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-mcp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C codegen-units=1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            cloud -> target
      - run: cargo fmt --manifest-path cloud/Cargo.toml --check
      - run: cargo clippy --manifest-path cloud/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo build --profile ci --locked -p solidcraft-cli --bin solidcraft-cli
      - name: Test OAuth and real CAD through HTTP handlers
        run: STUDIO_TEST_CLI="$PWD/target/ci/solidcraft-cli" cargo test --manifest-path cloud/Cargo.toml --locked
